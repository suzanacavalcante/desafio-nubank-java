name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Uma execução por ref: um push novo no mesmo PR cancela a anterior. Na main nada é cancelado, para cada
# commit ter o seu resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Só leitura: o workflow não precisa escrever nada no repositório.
permissions:
  contents: read

jobs:
  verify:
    name: Build e testes (./mvnw verify)
    # versão fixa: o rótulo ubuntu-latest muda sozinho (Ubuntu 26 em out/2026) e o Dependabot não o atualiza;
    # a troca vira um PR consciente
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # chave pelo hash dos pom.xml

      # Os testes de integração usam o Testcontainers (postgres:16); o runner ubuntu-latest já tem Docker.
      # Não há .env aqui: nenhum teste depende dele.
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

      - name: Relatórios dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  imagem:
    name: Imagem Docker e Compose (smoke test)
    # versão fixa: o rótulo ubuntu-latest muda sozinho (Ubuntu 26 em out/2026) e o Dependabot não o atualiza;
    # a troca vira um PR consciente
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Constrói a imagem do Dockerfile (o build da imagem não roda os testes; quem os roda é o job acima)
      # e sobe banco + API do zero. --wait só termina com o banco e a API saudáveis.
      - name: docker compose up --build --wait
        run: docker compose up --build -d --wait

      - name: GET /clientes responde 200
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/clientes)
          echo "GET /clientes -> $status"
          test "$status" = "200"

      - name: Logs (se falhar)
        if: failure()
        run: docker compose logs --no-color

      - name: Derruba o Compose
        if: always()
        run: docker compose down -v
