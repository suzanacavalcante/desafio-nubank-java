# Atualizações automáticas por PR. O springdoc não é gerenciado pelo BOM do Spring Boot (e traz um segundo
# stack Jackson 2): o Dependabot é quem avisa das atualizações e correções de segurança dele.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # salto de versão maior (JDK, PostgreSQL, Spring Boot...) é decisão manual; minor e patch seguem chegando
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # salto de versão maior (JDK, PostgreSQL, Spring Boot...) é decisão manual; minor e patch seguem chegando
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # imagens do docker-compose.yml (o ecossistema acima só olha o Dockerfile)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # salto de versão maior (JDK, PostgreSQL, Spring Boot...) é decisão manual; minor e patch seguem chegando
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
