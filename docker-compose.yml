services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cadastro}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Só localhost (não expõe o banco na rede). Porta 5434 por padrão para não conflitar
      # com PostgreSQL locais nas portas 5432 e 5433.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        # só inicia a API quando o banco responde (healthcheck do serviço db)
        condition: service_healthy
    environment:
      # Dentro da rede do Compose o banco é "db" na porta 5432 (DB_PORT é a porta publicada no host).
      # DB_USER/DB_PASSWORD/DB_NAME são os mesmos que criam o banco acima.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-cadastro}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Limita a memória do contêiner: o Dockerfile usa MaxRAMPercentage=75, então o heap máximo vira ~384 MB
    # (sem limite, seria 75% da memória da máquina). Ajuste se medir o consumo real.
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # A imagem só tem o JRE (sem curl): o bash (o sh padrão não tem /dev/tcp) pede GET /clientes?size=1 e espera 200.
      # size=1: a listagem é paginada, então isto lê um cliente por vez e ainda prova a conexão com o banco.
      # start_period dá tempo à JVM e às migrations; falhas nele não contam.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /clientes?size=1 HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
