services:
  db:
    image: postgres:16
    container_name: desafio-nubank-db
    environment:
      POSTGRES_DB: ${DB_NAME:-cadastro}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Porta do host em 5434 por padrão, para não conflitar com PostgreSQL locais nas portas 5432 e 5433
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
