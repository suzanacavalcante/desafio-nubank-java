# GUARDA: nenhum teste pode usar o banco do desenvolvedor por engano.
#
# Os testes de integração ligam a conexão ao PostgreSQL do Testcontainers pela anotação
# @UsaPostgresDeTeste, e essa conexão sobrepõe a URL abaixo. Uma classe de teste que usa banco e ESQUECEU a
# anotação cai nesta URL inválida e falha alto ("Connection refused"), em vez de conectar silenciosamente no
# banco do .env (onde alguns testes fazem truncate). Quem não usa banco não é afetado.
spring.datasource.url=jdbc:postgresql://localhost:1/proibido-usar-sem-UsaPostgresDeTeste
