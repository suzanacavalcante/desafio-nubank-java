spring:
  application:
    name: desafio-nubank-java
  config:
    # Lê o .env da raiz do projeto (se existir). Variáveis de ambiente reais têm precedência.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:cadastro}
    # Sem valores padrão: credenciais vêm do .env ou do ambiente
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  web:
    # Idioma fixo: as mensagens de validação (Hibernate Validator) saem sempre em português,
    # independentemente do idioma da máquina ou do cabeçalho Accept-Language.
    locale: pt-BR
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  error:
    # Páginas de erro do container (fora do MVC) também não vazam detalhes
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
