spring:
  application:
    name: desafio-nubank-java
  profiles:
    default: dev
  datasource:
    # Sem valores padrão aqui: fora do perfil "dev" a conexão deve vir do ambiente
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
