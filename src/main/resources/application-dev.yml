# Perfil de desenvolvimento. NÃO é ativado por padrão: ./mvnw spring-boot:run o ativa
# (propriedade spring-boot.run.profiles no pom.xml); na IDE, use SPRING_PROFILES_ACTIVE=dev.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
